services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civicpulse
    ports:
      - "5432:5432"
    volumes:
      - civic_pg:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civic_pg:
