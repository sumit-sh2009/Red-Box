  <path d="M 40,25 L 48,9 L 106,9 L 114,25 Z" fill="#f9a825"/>
  <!-- Windows (Left = Front) -->
  <polygon points="42,11 58,11 58,25 44,25" fill="#b3d9f7" opacity="0.90"/>
