  <rect x="4" y="38" width="6" height="7" rx="2" fill="#cfd8dc"/>
  <rect x="150" y="38" width="6" height="7" rx="2" fill="#cfd8dc"/>
  <!-- Front Wheel (Left) -->
  <circle cx="44" cy="46" r="11" fill="#212121"/>
  <circle cx="44" cy="46" r="7" fill="#78909c"/>
  <circle cx="44" cy="46" r="3.5" fill="#212121"/>
  <!-- Rear Wheel (Right) -->
  <circle cx="118" cy="46" r="11" fill="#212121"/>
  <circle cx="118" cy="46" r="7" fill="#78909c"/>
  <circle cx="118" cy="46" r="3.5" fill="#212121"/>
