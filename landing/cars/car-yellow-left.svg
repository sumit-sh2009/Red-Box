  <line x1="85" y1="10" x2="85" y2="25" stroke="#f9a825" stroke-width="2"/>
  <!-- Checkered / Accent Stripe -->
  <line x1="9" y1="30" x2="151" y2="30" stroke="#fff59d" stroke-width="1.2" opacity="0.6"/>
  <!-- Front Headlight (Left) -->
  <rect x="8" y="27" width="6" height="10" rx="2" fill="#f9a825"/>
