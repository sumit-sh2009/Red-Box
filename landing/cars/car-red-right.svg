  <!-- Rear Wheel (Left) -->
  <circle cx="42" cy="46" r="11" fill="#212121"/>
  <circle cx="42" cy="46" r="7" fill="#78909c"/>
  <circle cx="42" cy="46" r="3.5" fill="#212121"/>
  <!-- Front Wheel (Right) -->
  <circle cx="116" cy="46" r="11" fill="#212121"/>
  <circle cx="116" cy="46" r="7" fill="#78909c"/>
  <circle cx="116" cy="46" r="3.5" fill="#212121"/>
